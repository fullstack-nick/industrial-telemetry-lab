name: industrial-telemetry-lab

x-application-common: &application-common
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  environment: &application-environment
    LOCAL_DEVELOPMENT_TOKEN: ${LOCAL_API_TOKEN}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
    OTEL_PROPAGATORS: tracecontext,baggage
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=industrial-telemetry-lab,deployment.environment=local
  volumes:
    - application_logs:/var/log/telemetry
  networks:
    - telemetry

services:
  storage-init:
    image: eclipse-temurin:21.0.8_9-jre-jammy@sha256:db1689535962d757a5adabf57387584ed543d38c0b9d1fe870123ea362ad73b0
    restart: no
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    command: [chown, -R, "10001:10001", /data, /logs]
    volumes:
      - collector_data:/data
      - application_logs:/logs

  timescaledb:
    image: timescale/timescaledb:2.29.2-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - telemetry

  rabbitmq:
    image: rabbitmq:4.3.5-management@sha256:45226f38499559b9f56875c752cc6689ff90e8f20796fe80fd9bc28d64723031
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - telemetry

  seaweedfs:
    image: chrislusf/seaweedfs:4.44@sha256:e67e8c385484120b78bff47ba5f4debbca47fbd27ed1a39f016f47e8baea615b
    restart: unless-stopped
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY}
      S3_BUCKET: ${OBJECT_STORE_BUCKET}
    ports:
      - 127.0.0.1:8333:8333
      - 127.0.0.1:8888:8888
      - 127.0.0.1:9333:9333
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - telemetry

  database-migrate:
    <<: *application-common
    restart: no
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: telemetry-platform
    environment:
      <<: *application-environment
      APP_MODE: migrate
      SERVICE_NAME: database-migrate
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DATABASE_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RAW_STORE_ENDPOINT: http://seaweedfs:8333
      RAW_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY}
      RAW_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY}
      RAW_STORE_BUCKET: ${OBJECT_STORE_BUCKET}
    depends_on:
      storage-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  telemetry-gateway:
    <<: *application-common
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: telemetry-platform
    environment:
      <<: *application-environment
      APP_MODE: gateway
      SERVICE_NAME: telemetry-gateway
      SERVER_PORT: 8080
      FLYWAY_ENABLED: "false"
      DATABASE_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RAW_STORE_ENDPOINT: http://seaweedfs:8333
      RAW_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY}
      RAW_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY}
      RAW_STORE_BUCKET: ${OBJECT_STORE_BUCKET}
      OTEL_SERVICE_NAME: telemetry-gateway
      FAILURE_INJECTION_ENABLED: "true"
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      storage-init:
        condition: service_completed_successfully
      database-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/actuator/health/readiness]
      interval: 5s
      timeout: 3s
      retries: 30

  telemetry-worker:
    <<: *application-common
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: telemetry-platform
    environment:
      <<: *application-environment
      APP_MODE: worker
      SERVICE_NAME: telemetry-worker
      SERVER_PORT: 8083
      FLYWAY_ENABLED: "false"
      DATABASE_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RAW_STORE_ENDPOINT: http://seaweedfs:8333
      RAW_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY}
      RAW_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY}
      RAW_STORE_BUCKET: ${OBJECT_STORE_BUCKET}
      OTEL_SERVICE_NAME: telemetry-worker
    ports:
      - 127.0.0.1:8083:8083
    depends_on:
      storage-init:
        condition: service_completed_successfully
      database-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8083/actuator/health/readiness]
      interval: 5s
      timeout: 3s
      retries: 30

  controller-simulator:
    <<: *application-common
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: controller-simulator
    environment:
      <<: *application-environment
      SERVER_PORT: 8081
      SIMULATOR_SEED: ${SIMULATOR_RANDOM_SEED}
      OTEL_SERVICE_NAME: controller-simulator
    ports:
      - 127.0.0.1:8081:8081
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8081/actuator/health/readiness]
      interval: 5s
      timeout: 3s
      retries: 30

  edge-collector:
    <<: *application-common
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: edge-collector
    environment:
      <<: *application-environment
      SERVER_PORT: 8082
      COLLECTOR_DB_PATH: /data/collector.db
      JAVA_TOOL_OPTIONS: -Dorg.sqlite.tmpdir=/data
      SOURCE_URL: http://controller-simulator:8081
      GATEWAY_URL: http://telemetry-gateway:8080
      OTEL_SERVICE_NAME: edge-collector
    ports:
      - 127.0.0.1:8082:8082
    volumes:
      - application_logs:/var/log/telemetry
      - collector_data:/data
    depends_on:
      storage-init:
        condition: service_completed_successfully
      controller-simulator:
        condition: service_healthy
      telemetry-gateway:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8082/actuator/health/readiness]
      interval: 5s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - telemetry

  observability-storage-init:
    image: eclipse-temurin:21.0.8_9-jre-jammy@sha256:db1689535962d757a5adabf57387584ed543d38c0b9d1fe870123ea362ad73b0
    profiles: [observability]
    restart: no
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command:
      - sh
      - -c
      - chown -R 473:473 /alloy && chown -R 10001:10001 /loki /tempo
    volumes:
      - alloy_data:/alloy
      - loki_data:/loki
      - tempo_data:/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    networks:
      - telemetry

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    command: [-config.file=/etc/tempo/tempo.yaml]
    ports:
      - 127.0.0.1:3200:3200
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    depends_on:
      observability-storage-init:
        condition: service_completed_successfully
    networks:
      - telemetry

  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    command: [-config.file=/etc/loki/loki.yaml]
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/var/loki
    depends_on:
      observability-storage-init:
        condition: service_completed_successfully
    networks:
      - telemetry

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    user: "473:473"
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - 127.0.0.1:12345:12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - application_logs:/var/log/telemetry:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
      observability-storage-init:
        condition: service_completed_successfully
    networks:
      - telemetry

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
      - tempo
    networks:
      - telemetry

networks:
  telemetry:
    name: industrial-telemetry-lab

volumes:
  alloy_data:
  application_logs:
  collector_data:
  grafana_data:
  loki_data:
  prometheus_data:
  rabbitmq_data:
  seaweedfs_data:
  tempo_data:
  timescaledb_data:
