server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: ${SERVICE_NAME:telemetry-gateway}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/telemetry}
    username: ${POSTGRES_USER:telemetry}
    password: ${POSTGRES_PASSWORD:telemetry-local-only}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:telemetry}
    password: ${RABBITMQ_PASSWORD:telemetry-local-only}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 4
        concurrency: 1
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 4

telemetry:
  platform:
    mode: ${APP_MODE:gateway}
    local-token: ${LOCAL_DEVELOPMENT_TOKEN:replace-this-local-token}
    raw-store-endpoint: ${RAW_STORE_ENDPOINT:http://localhost:8333}
    raw-store-access-key: ${RAW_STORE_ACCESS_KEY:telemetry-local}
    raw-store-secret-key: ${RAW_STORE_SECRET_KEY:telemetry-local-secret}
    raw-store-bucket: ${RAW_STORE_BUCKET:telemetry-raw}
    maximum-compressed-bytes: 1048576
    maximum-decompressed-bytes: 10485760
    maximum-observations: 500
    default-mapping-version: ${MAPPING_VERSION:controller-a-mapping-1.0.0}
    default-quality-rules-version: ${QUALITY_RULES_VERSION:quality-rules-1.0.0}
    maximum-query-range: 24h
    default-page-size: 200
    maximum-page-size: 1000
    maximum-replay-range: 24h
    failure-injection-enabled: ${FAILURE_INJECTION_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: ${LOG_FILE:/var/log/telemetry/${spring.application.name}.json}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
      total-size-cap: 50MB
