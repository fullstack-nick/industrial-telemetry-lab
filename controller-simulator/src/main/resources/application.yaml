server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: controller-simulator
  lifecycle:
    timeout-per-shutdown-phase: 20s

telemetry:
  simulator:
    seed: ${SIMULATOR_SEED:20260829}
    history-capacity: ${SIMULATOR_HISTORY_CAPACITY:250000}
    production-interval-ms: ${SIMULATOR_INTERVAL_MS:5000}
    local-token: ${LOCAL_DEVELOPMENT_TOKEN:replace-this-local-token}
    source-system: controller-a

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: controller-simulator

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: ${LOG_FILE:/var/log/telemetry/controller-simulator.json}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
      total-size-cap: 50MB
